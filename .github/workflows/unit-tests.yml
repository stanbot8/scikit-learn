name: Unit tests
permissions:
  contents: read

on:
  push:
  pull_request:
  schedule:
    # Nightly build at 02:30 UTC
  - cron: 30 2 * * *
  # Manual run
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.event_name 
    != 'workflow_run' && (true) }}

env:
  VIRTUALENV: testvenv
  TEST_DIR: ${{ github.workspace }}/tmp_folder
  CCACHE_DIR: ${{ github.workspace }}/ccache
  COVERAGE: 'true'
  JUNITXML: test-data.xml

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: ${{ (github.repository == 'scikit-learn/scikit-learn') && 
      needs.alpha_bridge_inputs.outputs.changed == 'true' }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ (github.event_name == 'schedule' || github.event_name == 
          'workflow_run') && '9bbd3371ddb5094cbfe435d0e71d7b213ac0ce42' || 
          github.sha }}
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: pip
    - name: Install linters
      run: |
        pip install -r build_tools/github/lint_lock.txt
    - name: Run linters
      run: |-
        ./build_tools/linting.sh
    - name: Run Meson OpenMP checks
      run: |
        pip install ninja meson scipy
        python build_tools/check-meson-openmp-dependencies.py

    needs:
    - alpha_bridge_inputs
  retrieve-commit-message:
    name: Retrieve the latest commit message
    runs-on: ubuntu-latest
    if: ${{ (github.repository == 'scikit-learn/scikit-learn') && 
      needs.alpha_bridge_inputs.outputs.changed == 'true' }}
    outputs:
      message: ${{ steps.git-log.outputs.message }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
    - id: git-log
      name: Retrieve the latest commit message
      shell: bash
      run: |
        set -eu

        message=$(git log --format=%B -n 1)

        {
          echo 'message<<EOF'
          echo "${message}"
          echo EOF
        } >> "${GITHUB_OUTPUT}"

    needs:
    - alpha_bridge_inputs
  retrieve-selected-tests:
    # Parse the commit message to check if `build_tools/github/test_script.sh` should run
    # only specific tests.
    #
    # If so, selected tests will be run with SKLEARN_TESTS_GLOBAL_RANDOM_SEED="all".
    #
    # The commit message must take the form:
    #     <title> [all random seeds]
    #     <test_name_1>
    #     <test_name_2>
    #     ...
    name: Retrieve the selected tests
    runs-on: ubuntu-latest
    if: ${{ (github.repository == 'scikit-learn/scikit-learn') && 
      needs.alpha_bridge_inputs.outputs.changed == 'true' }}
    outputs:
      tests: ${{ steps.selected-tests.outputs.tests }}
    needs:
    - retrieve-commit-message
    - alpha_bridge_inputs
    steps:
    - id: selected-tests
      name: Retrieve the selected tests
      shell: python
      env:
        COMMIT_MESSAGE: ${{ needs.retrieve-commit-message.outputs.message }}
      run: |
        import os

        commit_message = os.environ["COMMIT_MESSAGE"]

        # Retrieve selected tests from commit message
        if "[all random seeds]" in commit_message:
            selected_tests = commit_message.split("[all random seeds]")[1].strip()
            selected_tests = selected_tests.replace("\n", " or ")
            # quote 'selected_tests' to cover the case of multiple selected tests
            selected_tests = f"{selected_tests!r}"
        else:
            selected_tests = ""

        # Write selected tests to `GITHUB_OUTPUT`
        with open(os.environ["GITHUB_OUTPUT"], "a") as file:
            file.write(f"tests={selected_tests}\n")

  unit-tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    if: ${{ (github.repository == 'scikit-learn/scikit-learn') && 
      needs.alpha_bridge_inputs.outputs.changed == 'true' }}
    needs:
    - lint
    - retrieve-commit-message
    - retrieve-selected-tests
    - alpha_bridge_inputs
    strategy:
      # Ensures that all builds run to completion even if one of them fails
      fail-fast: false
      matrix:
        include:
        - name: Linux pymin_conda_forge_arm
          os: ubuntu-24.04-arm
          DISTRIB: conda
          LOCK_FILE: 
            build_tools/github/pymin_conda_forge_arm_linux-aarch64_conda.lock

        - name: Linux x86-64 pylatest_conda_forge_mkl
          os: ubuntu-22.04
          DISTRIB: conda
          LOCK_FILE: 
            build_tools/github/pylatest_conda_forge_mkl_linux-64_conda.lock
          COVERAGE: true
          SKLEARN_TESTS_GLOBAL_RANDOM_SEED: 42    # default global random seed
          SCIPY_ARRAY_API: 1
            # Tests that require large downloads over the networks are skipped in CI.
            # Here we make sure, that they are still run on a regular basis.
          SKLEARN_SKIP_NETWORK_TESTS: ${{ (github.event_name == 'schedule' || 
            github.event_name == 'workflow_dispatch') && '0' || '1' }}

          # Check compilation with Ubuntu 22.04 LTS (Jammy Jellyfish) and scipy from conda-forge
        - name: Linux x86-64 pymin_conda_forge_openblas_ubuntu_2204
          os: ubuntu-22.04
          DISTRIB: conda
          LOCK_FILE: 
            build_tools/github/pymin_conda_forge_openblas_ubuntu_2204_linux-64_conda.lock
          SKLEARN_WARNINGS_AS_ERRORS: 1
          COVERAGE: false
          SKLEARN_TESTS_GLOBAL_RANDOM_SEED: 0    # non-default seed

          # Linux build with minimum supported version of dependencies
        - name: Linux x86-64 pymin_conda_forge_openblas_min_dependencies
          os: ubuntu-22.04
          DISTRIB: conda
          LOCK_FILE: 
            build_tools/github/pymin_conda_forge_openblas_min_dependencies_linux-64_conda.lock
            # Enable debug Cython directives to capture IndexError exceptions in
            # combination with the -Werror::pytest.PytestUnraisableExceptionWarning
            # flag for pytest.
            # https://github.com/scikit-learn/scikit-learn/pull/24438
          SKLEARN_ENABLE_DEBUG_CYTHON_DIRECTIVES: 1
          SKLEARN_RUN_FLOAT32_TESTS: 1
          SKLEARN_TESTS_GLOBAL_RANDOM_SEED: 2    # non-default seed

          # Linux environment to test the latest available dependencies.
          # It runs tests requiring lightgbm, pandas and PyAMG.
        - name: Linux pylatest_pip_openblas_pandas
          os: ubuntu-24.04
          DISTRIB: conda
          LOCK_FILE: 
            build_tools/github/pylatest_pip_openblas_pandas_linux-64_conda.lock
          SKLEARN_TESTS_GLOBAL_RANDOM_SEED: 3    # non-default seed
          SCIPY_ARRAY_API: 1
          CHECK_PYTEST_SOFT_DEPENDENCY: true
          SKLEARN_WARNINGS_AS_ERRORS: 1
            # disable pytest-xdist to have 1 job where OpenMP and BLAS are not single
            # threaded because by default the tests configuration (sklearn/conftest.py)
            # makes sure that they are single threaded in each xdist subprocess.
          PYTEST_XDIST_VERSION: none
          PIP_BUILD_ISOLATION: true

          # Linux environment to test that scikit-learn can be built against
          # versions of numpy, scipy with ATLAS that comes with Ubuntu 24.04
          # Noble Numbat i.e. numpy 1.26.4 and scipy 1.11.4
        - name: Linux x86-64 ubuntu_atlas
          os: ubuntu-24.04
          DISTRIB: ubuntu
          LOCK_FILE: build_tools/github/ubuntu_atlas_lock.txt
          COVERAGE: false
          SKLEARN_TESTS_GLOBAL_RANDOM_SEED: 1    # non-default seed

        - name: macOS pylatest_conda_forge_arm
          os: macos-15
          DISTRIB: conda
          LOCK_FILE: 
            build_tools/github/pylatest_conda_forge_osx-arm64_conda.lock
          SKLEARN_TESTS_GLOBAL_RANDOM_SEED: 5    # non-default seed
          SCIPY_ARRAY_API: 1
          PYTORCH_ENABLE_MPS_FALLBACK: 1
          CHECK_PYTEST_SOFT_DEPENDENCY: true

        - name: macOS x86-64 pylatest_conda_forge_mkl_no_openmp
          os: macos-15-intel
          DISTRIB: conda
          LOCK_FILE: 
            build_tools/github/pylatest_conda_forge_mkl_no_openmp_osx-64_conda.lock
          SKLEARN_TEST_NO_OPENMP: true
          SKLEARN_SKIP_OPENMP_TEST: true
          SKLEARN_TESTS_GLOBAL_RANDOM_SEED: 6    # non-default seed

        - name: Windows x64 pymin_conda_forge_openblas
          os: windows-latest
          DISTRIB: conda
          LOCK_FILE: 
            build_tools/github/pymin_conda_forge_openblas_win-64_conda.lock
          SKLEARN_WARNINGS_AS_ERRORS: 1
            # The Windows runner is typically much slower than other CI runners
            # due to the lack of compiler cache. Running the tests with coverage
            # enabled makes them run extra slow. Since very few parts of the
            # code should have windows-specific code branches, code coverage
            # collection is only done for the non-windows runners.
          COVERAGE: false
            # Enable debug Cython directives to capture IndexError exceptions in
            # combination with the -Werror::pytest.PytestUnraisableExceptionWarning
            # flag for pytest.
            # https://github.com/scikit-learn/scikit-learn/pull/24438
          SKLEARN_ENABLE_DEBUG_CYTHON_DIRECTIVES: 1
          SKLEARN_TESTS_GLOBAL_RANDOM_SEED: 7    # non-default seed

    env: ${{ matrix }}

    steps: &unit-tests-steps
    - name: Checkout
      uses: actions/checkout@v7

      # This step is necessary to access the job name the same way in both matrix and
      # non-matrix jobs (like free-threaded or scipy-dev builds).
      with:
        ref: ${{ (github.event_name == 'schedule' || github.event_name == 
          'workflow_run') && '9bbd3371ddb5094cbfe435d0e71d7b213ac0ce42' || 
          github.sha }}
    - name: Set JOB_NAME variable
      shell: bash
      run: |
        if [[ -z "$JOB_NAME" ]]; then
          echo "JOB_NAME=${{ matrix.name }}" >> $GITHUB_ENV
        fi

    - name: Create cache for ccache
      uses: actions/cache@v5
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-v1-${{ env.JOB_NAME }}-${{ hashFiles('**/*.pyx*', 
          '**/*.pxd*', '**/*.pxi*', '**/*.h', '**/*.c', '**/*.cpp', 
          format('{0}', env.LOCK_FILE)) }}
        restore-keys: ccache-${{ env.JOB_NAME }}

    - name: Set up conda
      uses: conda-incubator/setup-miniconda@v4
      if: ${{ startsWith(env.DISTRIB, 'conda') }}
      with:
        miniforge-version: latest
        auto-activate: true
        activate-environment: ''

    - name: Build scikit-learn
      run: |-
        bash -l build_tools/github/install.sh


      # Enable global random seed randomization to discover seed-sensitive tests
      # only on nightly builds.
      # https://scikit-learn.org/stable/developers/global_configuration.html#sklearn-tests-global-random-seed
    - name: Set random global random seed for nightly/manual runs
      if: github.event_name == 'schedule' || github.event_name == 
        'workflow_dispatch'
      shell: bash
      run: |
        SKLEARN_TESTS_GLOBAL_RANDOM_SEED=$((RANDOM % 20))
        echo "SKLEARN_TESTS_GLOBAL_RANDOM_SEED=$SKLEARN_TESTS_GLOBAL_RANDOM_SEED" >> $GITHUB_ENV
        echo "To reproduce this test run, set the following environment variable:"
        echo "    SKLEARN_TESTS_GLOBAL_RANDOM_SEED=$SKLEARN_TESTS_GLOBAL_RANDOM_SEED"
        echo "See: https://scikit-learn.org/dev/developers/global_configuration.html#sklearn-tests-global-random-seed"

      # Enable global dtype fixture for all nightly builds to discover
      # numerical-sensitive tests.
      # https://scikit-learn.org/stable/developers/global_configuration.html#sklearn-run-float32-tests
    - name: Run float32 tests for nightly/manual runs
      if: github.event_name == 'schedule' || github.event_name == 
        'workflow_dispatch'
      shell: bash
      run: |
        echo SKLEARN_RUN_FLOAT32_TESTS=1 >> $GITHUB_ENV

    - name: Run tests
      env:
        COMMIT_MESSAGE: ${{ needs.retrieve-commit-message.outputs.message }}
        SELECTED_TESTS: ${{ needs.retrieve-selected-tests.outputs.tests }}
        COVERAGE: ${{ env.COVERAGE == 'true' && 
          needs.retrieve-selected-tests.outputs.tests == ''}}
      run: |-
        bash -l build_tools/github/test_script.sh


    - name: Run doctests in .py and .rst files
      run: |-
        bash -l build_tools/github/test_docs.sh
      if: ${{ needs.retrieve-selected-tests.outputs.tests == ''}}

    - name: Run pytest soft dependency test
      run: |-
        bash -l build_tools/github/test_pytest_soft_dependency.sh
      if: ${{ env.CHECK_PYTEST_SOFT_DEPENDENCY == 'true' && 
        needs.retrieve-selected-tests.outputs.tests == ''}}

    - name: Combine coverage reports from parallel test runners
      run: |-
        bash -l build_tools/github/combine_coverage_reports.sh
      if: ${{ env.COVERAGE == 'true' && 
        needs.retrieve-selected-tests.outputs.tests == ''}}

    - name: Upload coverage report to Codecov
      uses: codecov/codecov-action@v6
      if: ${{ env.COVERAGE == 'true' && 
        needs.retrieve-selected-tests.outputs.tests == ''}}
      with:
        files: ./coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}
        disable_search: true

    - name: Update tracking issue
      if: ${{ always() && (github.event_name == 'schedule' || github.event_name 
        == 'workflow_dispatch')}}
      shell: bash
      run: |
        set -ex

        pip install defusedxml PyGithub
        python maint_tools/update_tracking_issue.py \
          ${{ secrets.BOT_GITHUB_TOKEN }} \
          "$GITHUB_WORKFLOW $JOB_NAME" \
          "$GITHUB_REPOSITORY" \
          https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID \
          --junit-file $TEST_DIR/$JUNITXML \
          --auto-close false \
          --job-name "$JOB_NAME"

  free-threaded:
    name: Linux x86-64 pylatest_free_threaded
    runs-on: ubuntu-latest
    needs:
    - lint
    - retrieve-commit-message
    - retrieve-selected-tests
    - alpha_bridge_inputs
    if: ${{ (contains(needs.retrieve-commit-message.outputs.message, 
      '[free-threaded]') || github.event_name == 'schedule' || github.event_name
      == 'workflow_dispatch') && needs.alpha_bridge_inputs.outputs.changed == 
      'true' }}
    env:
      DISTRIB: conda-free-threaded
      LOCK_FILE: build_tools/github/pylatest_free_threaded_linux-64_conda.lock
      COVERAGE: false
      # Disable pytest-xdist to use multiple cores for stress-testing with pytest-run-parallel
      PYTEST_XDIST_VERSION: none
      # To be able to access the job name in the steps, it must be set as an env variable.
      JOB_NAME: Linux x86-64 pylatest_free_threaded
    steps: *unit-tests-steps

  scipy-dev:
    name: Linux x86-64 pylatest_pip_scipy_dev
    runs-on: ubuntu-22.04
    needs:
    - lint
    - retrieve-commit-message
    - retrieve-selected-tests
    - alpha_bridge_inputs
    if: ${{ (contains(needs.retrieve-commit-message.outputs.message, 
      '[scipy-dev]') || github.event_name == 'schedule' || github.event_name == 
      'workflow_dispatch') && needs.alpha_bridge_inputs.outputs.changed == 
      'true' }}
    env:
      DISTRIB: conda-pip-scipy-dev
      LOCK_FILE: build_tools/github/pylatest_pip_scipy_dev_linux-64_conda.lock
      SKLEARN_WARNINGS_AS_ERRORS: 1
      CHECK_PYTEST_SOFT_DEPENDENCY: true
      # To be able to access the job name in the steps, it must be set as an env variable.
      JOB_NAME: Linux x86-64 pylatest_pip_scipy_dev
    steps: *unit-tests-steps

  debian-32bit:
    name: Linux i386 debian_32bit
    runs-on: ubuntu-24.04
    needs:
    - lint
    - retrieve-commit-message
    - retrieve-selected-tests
    - alpha_bridge_inputs
    env:
      DISTRIB: debian-32
      LOCK_FILE: build_tools/github/debian_32bit_lock.txt
      SKLEARN_TESTS_GLOBAL_RANDOM_SEED: 4  # non-default seed
      DOCKER_CONTAINER: i386/debian:trixie
      # To be able to access the job name in the steps, it must be set as an env variable.
      JOB_NAME: Linux i386 debian_32bit
    steps:
    - name: Checkout
      uses: actions/checkout@v7

      with:
        ref: ${{ (github.event_name == 'schedule' || github.event_name == 
          'workflow_run') && '9bbd3371ddb5094cbfe435d0e71d7b213ac0ce42' || 
          github.sha }}
    - name: Create cache for ccache
      uses: actions/cache@v5
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-v1-${{ env.JOB_NAME }}-${{ hashFiles('**/*.pyx*', 
          '**/*.pxd*', '**/*.pxi*', '**/*.h', '**/*.c', '**/*.cpp', 
          format('{0}', env.LOCK_FILE)) }}
        restore-keys: ccache-${{ env.JOB_NAME }}

    - name: Set up conda
      uses: conda-incubator/setup-miniconda@v4
      if: ${{ startsWith(env.DISTRIB, 'conda') }}
      with:
        miniforge-version: latest
        auto-activate: true
        activate-environment: ''

      # Enable global random seed randomization to discover seed-sensitive tests
      # only on nightly builds.
      # https://scikit-learn.org/stable/developers/global_configuration.html#sklearn-tests-global-random-seed
    - name: Set random global random seed for nightly/manual runs
      if: github.event_name == 'schedule' || github.event_name == 
        'workflow_dispatch'
      shell: bash
      run: |
        SKLEARN_TESTS_GLOBAL_RANDOM_SEED=$((RANDOM % 20))
        echo "SKLEARN_TESTS_GLOBAL_RANDOM_SEED=$SKLEARN_TESTS_GLOBAL_RANDOM_SEED" >> $GITHUB_ENV
        echo "To reproduce this test run, set the following environment variable:"
        echo "    SKLEARN_TESTS_GLOBAL_RANDOM_SEED=$SKLEARN_TESTS_GLOBAL_RANDOM_SEED"
        echo "See: https://scikit-learn.org/dev/developers/global_configuration.html#sklearn-tests-global-random-seed"

      # Enable global dtype fixture for all nightly builds to discover
      # numerical-sensitive tests.
      # https://scikit-learn.org/stable/developers/global_configuration.html#sklearn-run-float32-tests
    - name: Run float32 tests for nightly/manual runs
      if: github.event_name == 'schedule' || github.event_name == 
        'workflow_dispatch'
      shell: bash
      run: |
        echo SKLEARN_RUN_FLOAT32_TESTS=1 >> $GITHUB_ENV

    - name: Start container
        # Environment variable are passed when starting the container rather
        # than in "Run tests step" for more standard jobs
      env:
        COMMIT_MESSAGE: ${{ needs.retrieve-commit-message.outputs.message }}
        SELECTED_TESTS: ${{ needs.retrieve-selected-tests.outputs.tests }}
        COVERAGE: ${{ env.COVERAGE == 'true' && 
          needs.retrieve-selected-tests.outputs.tests == ''}}
      run: |
        docker container run --rm --volume $TEST_DIR:/temp_dir --volume $PWD:/scikit-learn --volume $CCACHE_DIR:/ccache -w /scikit-learn --detach --name skcontainer -e TEST_DIR=/temp_dir -e CCACHE_DIR=/ccache -e COVERAGE -e DISTRIB -e LOCK_FILE -e JUNITXML -e VIRTUALENV -e PYTEST_XDIST_VERSION -e SKLEARN_SKIP_NETWORK_TESTS -e SELECTED_TESTS -e CCACHE_COMPRESS -e COMMIT_MESSAGE -e JOB_NAME -e SKLEARN_TESTS_GLOBAL_RANDOM_SEED -e SKLEARN_RUN_FLOAT32_TESTS $DOCKER_CONTAINER sleep 1000000

    - name: Build scikit-learn
      run: |-
        docker exec skcontainer bash -l build_tools/github/install.sh


    - name: Run tests
      run: |-
        docker exec skcontainer bash -l build_tools/github/test_script.sh


    - name: Run doctests in .py and .rst files
      run: |-
        docker exec skcontainer bash -l build_tools/github/test_docs.sh
      if: ${{ needs.retrieve-selected-tests.outputs.tests == ''}}

    - name: Run pytest soft dependency test
      run: |-
        docker exec skcontainer build_tools/github/test_pytest_soft_dependency.sh
      if: ${{ env.CHECK_PYTEST_SOFT_DEPENDENCY == 'true' && 
        needs.retrieve-selected-tests.outputs.tests == ''}}

    - name: Combine coverage reports from parallel test runners
      run: |-
        docker exec skcontainer bash -l build_tools/github/combine_coverage_reports.sh
      if: ${{ env.COVERAGE == 'true' && 
        needs.retrieve-selected-tests.outputs.tests == ''}}

    - name: Upload coverage report to Codecov
      uses: codecov/codecov-action@v6
      if: ${{ env.COVERAGE == 'true' && 
        needs.retrieve-selected-tests.outputs.tests == ''}}
      with:
        files: ./coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}
        disable_search: true

    - name: Update tracking issue
      if: ${{ always() && (github.event_name == 'schedule' || github.event_name 
        == 'workflow_dispatch')}}
      run: |
        set -ex

        pip install defusedxml PyGithub
        python maint_tools/update_tracking_issue.py \
          ${{ secrets.BOT_GITHUB_TOKEN }} \
          "$GITHUB_WORKFLOW $JOB_NAME" \
          "$GITHUB_REPOSITORY" \
          https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID \
          --junit-file $TEST_DIR/$JUNITXML \
          --auto-close false \
          --job-name "$JOB_NAME"

  # This aggregates all unit test jobs statuses into a single status. This is
  # useful to be able to have a single required check in GitHub.
    if: ${{ (success()) && needs.alpha_bridge_inputs.outputs.changed == 'true' 
      }}
  check-job-statuses:
    name: Check all job statuses
    runs-on: ubuntu-latest
    if: ${{ (always() && github.repository == 'scikit-learn/scikit-learn') && 
      needs.alpha_bridge_inputs.outputs.changed == 'true' }}
    needs:
    - lint
    - unit-tests
    - debian-32bit
    - free-threaded
    - scipy-dev
    - alpha_bridge_inputs
    steps:
    - uses: re-actors/alls-green@release/v1
      with:
        jobs: ${{ toJSON(needs) }}
        allowed-skips: free-threaded,scipy-dev
  alpha_bridge_inputs:
    name: AlphaBridge input check
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    concurrency:
      group: alpha-bridge-inputs-${{ github.workflow }}-${{ github.sha }}-${{ 
        github.event.schedule || github.event_name }}
      cancel-in-progress: false
    outputs:
      changed: ${{ steps.identity.outputs.changed }}
    steps:
    - id: identity
      name: Check source, workflow, variables, and runner inputs
      env:
        GH_TOKEN: ${{ github.token }}
        AB_REPOSITORY: ${{ github.repository }}
        AB_RUN_ID: ${{ github.run_id }}
        AB_HEAD_SHA: 9bbd3371ddb5094cbfe435d0e71d7b213ac0ce42
        AB_WORKFLOW_DIGEST: 
          d76b76c28cac4f14958042f9addf022d29a52b2deacd40e0e4ac6658711a10b8
        AB_EVENT: ${{ github.event_name }}
        AB_SCHEDULE: ${{ github.event.schedule || '' }}
        AB_VARIABLES: ${{ toJSON(vars) }}
        AB_INPUTS: ${{ toJSON(inputs) }}
        AB_WORKFLOW_RUN: ${{ toJSON(github.event.workflow_run) }}
      shell: bash
      run: "python3 - <<'ALPHA_BRIDGE_CI_PY'\n\"\"\"Native scheduled-CI input check,
        embedded in the owned fork configuration.\"\"\"\n\nfrom __future__ import
        annotations\n\nimport base64\nimport hashlib\nimport json\nimport os\nimport
        re\nimport urllib.parse\nimport urllib.request\n\n\ndef parent_has_work(get,
        repository, parent):\n    if (\n        not parent\n        or parent.get(\"\
        head_branch\") != \"alpha-bridge-ci\"\n        or parent.get(\"status\") !=
        \"completed\"\n    ):\n        return True\n    sha = parent[\"head_sha\"\
        ]\n    if re.fullmatch(r\"[0-9a-f]{40}\", sha) is None:\n        raise ValueError(\"\
        parent workflow has no exact configuration commit\")\n    record = get(f\"\
        /repos/{repository}\")\n    marker_file = get(f\"/repos/{repository}/contents/.github/alpha-bridge-ci.json?ref={sha}\"\
        )\n    marker = json.loads(base64.b64decode(marker_file[\"content\"]))\n \
        \   if (\n        record.get(\"fork\") is not True\n        or marker.get(\"\
        schema\") != \"alpha-bridge/fork-ci\"\n        or marker.get(\"source_repository\"\
        ) != record.get(\"parent\", {}).get(\"full_name\")\n    ):\n        raise
        ValueError(\"parent CI configuration has no verified fork ownership\")\n \
        \   path = parent[\"path\"].split(\"@\", 1)[0]\n    if not path.startswith(\"\
        .github/workflows/\") or \"/\" in path.removeprefix(\".github/workflows/\"\
        ):\n        raise ValueError(\"parent workflow path is outside its configuration
        owner\")\n    definition = get(f\"/repos/{repository}/contents/{urllib.parse.quote(path,
        safe='/')}?ref={sha}\")\n    if hashlib.sha256(base64.b64decode(definition[\"\
        content\"])).hexdigest() != marker.get(\n        \"definition_sha256\", {}\n\
        \    ).get(path):\n        raise ValueError(\"parent workflow differs from
        its owned definition\")\n    if path == \".github/workflows/alpha-bridge-ci-verify.yml\"\
        :\n        return False\n    jobs = []\n    page = 1\n    while True:\n  \
        \      values = get(\n            f\"/repos/{repository}/actions/runs/{parent['id']}/jobs?per_page=100&page={page}\"\
        \n        )[\"jobs\"]\n        jobs.extend(values)\n        if len(values)
        < 100:\n            break\n        page += 1\n    guards = [\n        job\n\
        \        for job in jobs\n        if job.get(\"name\") == \"AlphaBridge input
        check\"\n        and job.get(\"conclusion\") == \"success\"\n        and any(\n\
        \            re.fullmatch(r\"AlphaBridge input identity [0-9a-f]{64}\", step.get(\"\
        name\", \"\"))\n            and step.get(\"conclusion\") == \"success\"\n\
        \            for step in job.get(\"steps\", [])\n        )\n    ]\n    return
        not guards or any(\n        job not in guards and job.get(\"conclusion\")
        != \"skipped\" for job in jobs\n    )\n\n\ndef changed(get, *, repository,
        run_id, identity, job_name):\n    current = get(f\"/repos/{repository}/actions/runs/{run_id}\"\
        )\n    event = current[\"event\"]\n    query = urllib.parse.urlencode(\n \
        \       {\n            \"branch\": current[\"head_branch\"],\n           \
        \ \"event\": event,\n            \"per_page\": 100,\n        }\n    )\n  \
        \  runs = get(f\"/repos/{repository}/actions/workflows/{current['workflow_id']}/runs?{query}\"\
        )\n    for run in runs[\"workflow_runs\"]:\n        if run[\"id\"] == run_id:\n\
        \            continue\n        if run.get(\"head_branch\") != current[\"head_branch\"\
        ] or run.get(\"event\") != event:\n            raise ValueError(\"provider
        returned a different CI input identity\")\n        page = 1\n        while
        True:\n            jobs = get(\n                f\"/repos/{repository}/actions/runs/{run['id']}/jobs?per_page=100&page={page}\"\
        \n            )[\"jobs\"]\n            for job in jobs:\n                if
        (\n                    job[\"name\"] == job_name\n                    and
        job.get(\"status\") == \"completed\"\n                    and job.get(\"conclusion\"\
        ) == \"success\"\n                    and any(\n                        step[\"\
        name\"] == f\"AlphaBridge input identity {identity}\"\n                  \
        \      and step.get(\"conclusion\") == \"success\"\n                     \
        \   for step in job.get(\"steps\", [])\n                    )\n          \
        \      ):\n                    return False\n            if len(jobs) < 100:\n\
        \                break\n            page += 1\n    return True\n\n\ndef main():\n\
        \    inputs = {\n        \"source_commit\": os.environ[\"AB_HEAD_SHA\"],\n\
        \        \"workflow_definition\": os.environ[\"AB_WORKFLOW_DIGEST\"],\n  \
        \      \"event\": os.environ[\"AB_EVENT\"],\n        \"schedule\": os.environ[\"\
        AB_SCHEDULE\"],\n        \"variables\": json.loads(os.environ[\"AB_VARIABLES\"\
        ]),\n        \"inputs\": json.loads(os.environ[\"AB_INPUTS\"]),\n        \"\
        runner_image\": [os.environ.get(\"ImageOS\", \"\"), os.environ.get(\"ImageVersion\"\
        , \"\")],\n        \"producer\": json.loads(os.environ.get(\"AB_WORKFLOW_RUN\"\
        , \"null\")),\n    }\n    identity = hashlib.sha256(json.dumps(inputs, sort_keys=True).encode()).hexdigest()\n\
        \n    def get(path):\n        request = urllib.request.Request(\n        \
        \    \"https://api.github.com\" + path,\n            headers={\n         \
        \       \"Authorization\": \"Bearer \" + os.environ[\"GH_TOKEN\"],\n     \
        \           \"Accept\": \"application/vnd.github+json\",\n               \
        \ \"X-GitHub-Api-Version\": \"2026-03-10\",\n            },\n        )\n \
        \       with urllib.request.urlopen(request, timeout=60) as response:\n  \
        \          return json.load(response)\n\n    should_run = inputs[\"event\"\
        ] not in {\"schedule\", \"workflow_run\"} or (\n        (\n            inputs[\"\
        event\"] != \"workflow_run\"\n            or parent_has_work(get, os.environ[\"\
        AB_REPOSITORY\"], inputs[\"producer\"])\n        )\n        and changed(\n\
        \            get,\n            repository=os.environ[\"AB_REPOSITORY\"],\n\
        \            run_id=int(os.environ[\"AB_RUN_ID\"]),\n            identity=identity,\n\
        \            job_name=\"AlphaBridge input check\",\n        )\n    )\n   \
        \ with open(os.environ[\"GITHUB_OUTPUT\"], \"a\", encoding=\"utf-8\") as output:\n\
        \        output.write(f\"digest={identity}\\nchanged={str(should_run).lower()}\\\
        n\")\n    print(\"CI inputs changed\" if should_run else \"CI inputs unchanged;
        build and test jobs skipped\")\n\n\nif __name__ == \"__main__\":\n    main()\n\
        \nALPHA_BRIDGE_CI_PY\n"
    - name: AlphaBridge input identity ${{ steps.identity.outputs.digest }}
