# Workflow to update lock files
name: Update lock files
permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
  - cron: 0 5 * * 1

jobs:
  update_lock_files:
    if: ${{ (github.repository == 'scikit-learn/scikit-learn') && 
      needs.alpha_bridge_inputs.outputs.changed == 'true' }}
    runs-on: ubuntu-latest

    strategy:
      # Ensure that each build will continue even if one build in the matrix fails
      fail-fast: false
      matrix:
        include:
        - name: main
          update_script_args: --select-tag main-ci
          additional_commit_message: '[doc build]'
        - name: scipy-dev
          update_script_args: --select-tag scipy-dev
          additional_commit_message: '[scipy-dev]'
        - name: free-threaded
          update_script_args: --select-tag free-threaded
          additional_commit_message: '[free-threaded]'
        - name: array-api
          update_script_args: --select-tag cuda
        - name: lint
          update_script_args: --select-tag lint

    steps:
    - uses: actions/checkout@v7
    - name: Generate lock files
      run: |
        source build_tools/shared.sh
        source $CONDA/bin/activate
        conda update -n base --all
        conda install -n base conda conda-libmamba-solver -y
        conda config --set solver libmamba
        conda install -c conda-forge "$(get_dep conda-lock min)" -y

        python build_tools/update_environments_and_lock_files.py ${{ matrix.update_script_args }}

    - name: Create Pull Request
      id: cpr
      uses: peter-evans/create-pull-request@v8
      with:
        token: ${{ secrets.BOT_GITHUB_TOKEN }}
        push-to-fork: scikit-learn-bot/scikit-learn
        commit-message: Update CI lock files ${{ 
          matrix.additional_commit_message }}
        committer: Lock file bot <noreply@github.com>
        author: Lock file bot <noreply@github.com>
        delete-branch: true
        branch: auto-update-lock-files-${{ matrix.name }}
        title: ':lock: :robot: CI Update lock files for ${{ matrix.name }} CI build(s)
          :lock: :robot:'
        body: |
          Update lock files.

          The update was generated by running:
          ```
          python build_tools/update_environments_and_lock_files.py ${{ matrix.update_script_args }}
          ```

          ### Note
          If the CI tasks fail, create a new branch based on this PR and add the required fixes to that branch.
          Prefer re-running the same command above (with the matching `--select-tag`) rather than updating all lock files.
          ${{ matrix.additional_commit_message && format('Remember to include `{0}` in your commit message so that the optional CI build runs.', matrix.additional_commit_message) || '' }}

      # The CUDA workflow needs to be triggered explicitly as it uses an expensive runner
    - name: Trigger additional tests
      if: steps.cpr.outputs.pull-request-number != '' && matrix.name == 
        'array-api'
      env:
        GH_TOKEN: ${{ secrets.TRIAGE_BOT_GITHUB_TOKEN }}
        PR_NUMBER: ${{steps.cpr.outputs.pull-request-number}}
      run: |
        curl -L \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/scikit-learn/scikit-learn/issues/$PR_NUMBER/labels \
          -d '{"labels":["CUDA CI"]}'

    - name: Check Pull Request
      if: steps.cpr.outputs.pull-request-number != ''
      run: |
        echo "### :rocket: Pull-Request Summary" >> ${GITHUB_STEP_SUMMARY}
        echo "" >> ${GITHUB_STEP_SUMMARY}
        echo "The following lock files pull-request has been auto-generated:"
        echo "- **PR** #${{ steps.cpr.outputs.pull-request-number }}" >> ${GITHUB_STEP_SUMMARY}
        echo "- **URL** ${{ steps.cpr.outputs.pull-request-url }}" >> ${GITHUB_STEP_SUMMARY}
        echo "- **Operation** [${{ steps.cpr.outputs.pull-request-operation }}]" >> ${GITHUB_STEP_SUMMARY}
        echo "- **SHA** ${{ steps.cpr.outputs.pull-request-head-sha }}" >> ${GITHUB_STEP_SUMMARY}
    needs:
    - alpha_bridge_inputs
  alpha_bridge_inputs:
    name: AlphaBridge input check
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    concurrency:
      group: alpha-bridge-inputs-${{ github.workflow }}-${{ github.sha }}-${{ 
        github.event.schedule || github.event_name }}
      cancel-in-progress: false
    outputs:
      changed: ${{ steps.identity.outputs.changed }}
    steps:
    - id: identity
      name: Check source, workflow, variables, and runner inputs
      env:
        GH_TOKEN: ${{ github.token }}
        AB_REPOSITORY: ${{ github.repository }}
        AB_RUN_ID: ${{ github.run_id }}
        AB_HEAD_SHA: 9bbd3371ddb5094cbfe435d0e71d7b213ac0ce42
        AB_WORKFLOW_DIGEST: 
          5d41c9a431beb425806d41eb5c95937817e0cb42900b49a6c71988f1825ab887
        AB_EVENT: ${{ github.event_name }}
        AB_SCHEDULE: ${{ github.event.schedule || '' }}
        AB_VARIABLES: ${{ toJSON(vars) }}
        AB_INPUTS: ${{ toJSON(inputs) }}
      shell: bash
      run: "python3 - <<'ALPHA_BRIDGE_CI_PY'\n\"\"\"Native scheduled-CI input check,
        embedded in the owned fork configuration.\"\"\"\n\nfrom __future__ import
        annotations\n\nimport hashlib\nimport json\nimport os\nimport urllib.parse\n\
        import urllib.request\n\n\ndef changed(get, *, repository, run_id, identity,
        job_name):\n    current = get(f\"/repos/{repository}/actions/runs/{run_id}\"\
        )\n    event = current[\"event\"]\n    query = urllib.parse.urlencode(\n \
        \       {\n            \"branch\": current[\"head_branch\"],\n           \
        \ \"event\": event,\n            \"per_page\": 100,\n        }\n    )\n  \
        \  runs = get(f\"/repos/{repository}/actions/workflows/{current['workflow_id']}/runs?{query}\"\
        )\n    for run in runs[\"workflow_runs\"]:\n        if run[\"id\"] == run_id:\n\
        \            continue\n        if run.get(\"head_branch\") != current[\"head_branch\"\
        ] or run.get(\"event\") != event:\n            raise ValueError(\"provider
        returned a different CI input identity\")\n        page = 1\n        while
        True:\n            jobs = get(\n                f\"/repos/{repository}/actions/runs/{run['id']}/jobs?per_page=100&page={page}\"\
        \n            )[\"jobs\"]\n            for job in jobs:\n                if
        (\n                    job[\"name\"] == job_name\n                    and
        job.get(\"status\") == \"completed\"\n                    and job.get(\"conclusion\"\
        ) == \"success\"\n                    and any(\n                        step[\"\
        name\"] == f\"AlphaBridge input identity {identity}\"\n                  \
        \      and step.get(\"conclusion\") == \"success\"\n                     \
        \   for step in job.get(\"steps\", [])\n                    )\n          \
        \      ):\n                    return False\n            if len(jobs) < 100:\n\
        \                break\n            page += 1\n    return True\n\n\ndef main():\n\
        \    inputs = {\n        \"source_commit\": os.environ[\"AB_HEAD_SHA\"],\n\
        \        \"workflow_definition\": os.environ[\"AB_WORKFLOW_DIGEST\"],\n  \
        \      \"event\": os.environ[\"AB_EVENT\"],\n        \"schedule\": os.environ[\"\
        AB_SCHEDULE\"],\n        \"variables\": json.loads(os.environ[\"AB_VARIABLES\"\
        ]),\n        \"inputs\": json.loads(os.environ[\"AB_INPUTS\"]),\n        \"\
        runner_image\": [os.environ.get(\"ImageOS\", \"\"), os.environ.get(\"ImageVersion\"\
        , \"\")],\n    }\n    identity = hashlib.sha256(json.dumps(inputs, sort_keys=True).encode()).hexdigest()\n\
        \n    def get(path):\n        request = urllib.request.Request(\n        \
        \    \"https://api.github.com\" + path,\n            headers={\n         \
        \       \"Authorization\": \"Bearer \" + os.environ[\"GH_TOKEN\"],\n     \
        \           \"Accept\": \"application/vnd.github+json\",\n               \
        \ \"X-GitHub-Api-Version\": \"2026-03-10\",\n            },\n        )\n \
        \       with urllib.request.urlopen(request, timeout=60) as response:\n  \
        \          return json.load(response)\n\n    should_run = inputs[\"event\"\
        ] != \"schedule\" or changed(\n        get,\n        repository=os.environ[\"\
        AB_REPOSITORY\"],\n        run_id=int(os.environ[\"AB_RUN_ID\"]),\n      \
        \  identity=identity,\n        job_name=\"AlphaBridge input check\",\n   \
        \ )\n    with open(os.environ[\"GITHUB_OUTPUT\"], \"a\", encoding=\"utf-8\"\
        ) as output:\n        output.write(f\"digest={identity}\\nchanged={str(should_run).lower()}\\\
        n\")\n    print(\"CI inputs changed\" if should_run else \"CI inputs unchanged;
        build and test jobs skipped\")\n\n\nif __name__ == \"__main__\":\n    main()\n\
        \nALPHA_BRIDGE_CI_PY\n"
    - name: AlphaBridge input identity ${{ steps.identity.outputs.digest }}
      run: echo 'Input identity recorded'
